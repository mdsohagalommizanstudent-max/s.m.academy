<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="bg-light">

<div class="container">
    <div class="row justify-content-center mt-5">
        <div class="col-md-4">

            <div class="card shadow">
                <div class="card-body">

                    <h3 class="text-center mb-4">Admin Login</h3>

                    <input type="text" id="username" class="form-control mb-3" placeholder="Username">

                    <input type="password" id="password" class="form-control mb-3" placeholder="Password">

                    <button class="btn btn-primary w-100" onclick="login()">
                        Login
                    </button>

                    <p id="msg" class="text-danger mt-3 text-center"></p>

                </div>
            </div>

        </div>
    </div>
</div>

<script>

const WEBAPP = "https://script.google.com/macros/s/AKfycbx0eiSi287myYfplQd97hLFOmrxzjO4Gtvj_1p_N7ufAvlEDdCN_bLL0jv4mU_tK39OIQ/exec";

function login(){

fetch(WEBAPP,{
method:"POST",
body:JSON.stringify({
username:document.getElementById("username").value,
password:document.getElementById("password").value
})
})
.then(res=>res.json())
.then(data=>{

if(data.status=="success"){

localStorage.setItem("login","true");

window.location="admin.html";

}else{

document.getElementById("msg").innerHTML="Username অথবা Password ভুল";

}

});

}

</script>

</body>
</html>
